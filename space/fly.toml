# Fly.io deployment. Chosen for time-to-live-URL: Fly serves the app on
# <app>.fly.dev with a valid certificate straight away, so the demo is reachable
# without waiting on DNS or on Caddy's Let's Encrypt issuance.
#
# Caddy and compose.yaml are NOT used here — Fly terminates TLS itself. They
# remain in this directory for the plain-VPS path (see DEPLOY.md).
#
# Key ordering and [[table]] forms below are what `fly launch` normalises to;
# keeping them means a future `fly launch` rewrite only strips these comments
# rather than reshuffling the file.

app = 'cultura-viva-demo'
# Paris. Fly has no Madrid or Barcelona region, so this is the closest to the
# monuments; `fly launch --region mad` silently falls back here.
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  # Weights and the Hub cache. Without this every deploy re-downloads ~700 MB
  # and the first visitor after each deploy waits for it. The volume must live
  # in primary_region — a machine cannot attach a volume from another region.
  source = 'cv_models'
  destination = '/app/models'

[http_service]
  internal_port = 7860
  force_https = true
  # The demo preloads ~1 GB of weights at boot. Stopping idle machines would
  # make the next visitor wait through that reload, so it stays warm. Set this
  # to 'suspend' with min_machines_running = 0 to trade that for a lower bill.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # One question occupies the CPU completely; queueing at the edge is kinder
    # than letting requests pile onto a saturated machine.
    type = 'requests'
    hard_limit = 4
    soft_limit = 1

[checks]
  [checks.up]
    port = 7860
    type = 'http'
    interval = '30s'
    timeout = '10s'
    # First boot downloads the weights and preloads every stage before Gradio
    # serves anything. A short grace period would kill the machine mid-download.
    grace_period = '20m0s'
    path = '/'

[[vm]]
  # shared-cpu-1x caps at 2048 MB, so more RAM requires a larger size. The
  # second vCPU is welcome anyway: the SLM is the slowest stage and scales with
  # cores.
  size = 'shared-cpu-2x'
  # Sized for the 1.5B SLM: ~1.66 GB with SLM + Whisper + Piper warm, plus
  # ~350 MB once the vision classifier loads, so ~2.0 GB steady state. 2 GB did
  # not fit that; 3 GB leaves ~900 MB of headroom.
  #
  # Keep this in step with `fly scale memory` — a deploy applies whatever is
  # written here, so scaling the machine without editing this reverts on the
  # next deploy.
  memory = '3gb'
